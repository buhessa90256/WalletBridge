name: Import Android project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import prepared sources
        run: |
          if [ ! -f WalletBridge-source.zip ]; then exit 0; fi
          echo '2dcf26f662f8b9f4da1e90e3900d81a7246831f12231162d05ff243916badba6  WalletBridge-source.zip' | sha256sum --check
          unzip -o WalletBridge-source.zip
          chmod +x gradlew
          git rm WalletBridge-source.zip
          git add app gradle gradlew gradlew.bat build.gradle settings.gradle gradle.properties .gitignore README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add complete ColorOS FinShell intent bridge Android project'
          git push origin HEAD:main
